[package]
name = "vg-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "voiceghostty"
path = "src/main.rs"

[dependencies]
vg-core.workspace = true
vg-voice.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
eframe = "0.36"
alacritty_terminal = "0.26"
egui = "0.36"
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 只用来把菜单里的「退出」改成走关闭窗口的确认流程(见 src/macos.rs)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }

[features]
whisper = ["vg-voice/whisper"]
whisper-metal = ["vg-voice/whisper-metal"]
