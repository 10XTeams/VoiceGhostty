name: Build & Release

# Push a tag like v0.1.0 to build the .app and attach it to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  build:
    # macos-15, not macos-14: Package.swift declares swift-tools-version:6.1, and the macos-14 image
    # defaults to Xcode 15.4 (Swift 5.10), which refuses to even parse the manifest. macos-15 defaults
    # to Xcode 16.4 (Swift 6.1.x).
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (release)
        run: swift build -c release

      - name: Package .app bundle
        run: |
          set -euo pipefail
          APP=build/VoiceGhostty.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/VoiceGhostty "$APP/Contents/MacOS/"
          cp Resources/Info.plist        "$APP/Contents/"
          cp Resources/AppIcon.icns      "$APP/Contents/Resources/"
          # Ad-hoc signature (no paid Developer ID). Gatekeeper still quarantines downloads —
          # the Homebrew cask clears that on install, manual installers run `xattr -cr` once.
          # Both paths are documented in the README and in the release notes below.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "codesign OK"

      - name: Zip for release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          ZIP="VoiceGhostty-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/VoiceGhostty.app "$ZIP"
          echo "ASSET=$ZIP" >> "$GITHUB_ENV"
          shasum -a 256 "$ZIP"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGhostty-app
          path: ${{ env.ASSET }}

      - name: Create / update GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ### Install

            **Homebrew (easiest):**
            ```bash
            brew install --cask 10xteams/tap/voiceghostty
            ```

            **Manual:** download the `.zip` below, unzip, move to `/Applications`, then clear the
            quarantine flag — the build is ad-hoc signed and not notarized, so Gatekeeper blocks it
            until you do:
            ```bash
            xattr -cr /Applications/VoiceGhostty.app
            open /Applications/VoiceGhostty.app
            ```
            Prefer not to run `xattr`? Let the first launch be blocked, then **System Settings →
            Privacy & Security → Open Anyway**. (Right-click → Open no longer works on current macOS.)

            Grant **Microphone** and **Speech Recognition** when macOS asks.

            Requires macOS 13+. Built from source with `swift build -c release`.
