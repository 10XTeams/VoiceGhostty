name: Build & Release

# Push a tag like v0.1.0 to build the macOS .app and attach it to a GitHub Release.
# The tag must match the workspace version in Cargo.toml; the build fails otherwise.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  build:
    runs-on: macos-15      # Apple Silicon runner; cmake (needed by whisper.cpp) is preinstalled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Show toolchain
        run: |
          cargo --version
          cmake --version | head -1

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace

      - name: Build and package .app (release, whisper + Metal)
        run: ./make-app.sh --no-open

      - name: Sign (ad-hoc) and verify
        run: |
          set -euo pipefail
          # Ad-hoc signature (no paid Developer ID). Gatekeeper still quarantines downloads —
          # the Homebrew cask clears that on install, manual installers run `xattr -cr` once.
          codesign --force --deep --sign - build/VoiceGhostty.app
          codesign --verify --deep --strict build/VoiceGhostty.app && echo "codesign OK"

      - name: Zip for release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          ZIP="VoiceGhostty-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/VoiceGhostty.app "$ZIP"
          echo "ASSET=$ZIP" >> "$GITHUB_ENV"
          shasum -a 256 "$ZIP"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGhostty-app
          path: ${{ env.ASSET }}

      - name: Create / update GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ### Install

            **Homebrew (easiest):**
            ```bash
            brew install --cask 10xteams/tap/voiceghostty
            ```

            **Manual:** download the `.zip` below, unzip, move to `/Applications`, then clear the
            quarantine flag — the build is ad-hoc signed and not notarized, so Gatekeeper blocks it
            until you do:
            ```bash
            xattr -cr /Applications/VoiceGhostty.app
            open /Applications/VoiceGhostty.app
            ```
            Prefer not to run `xattr`? Let the first launch be blocked, then **System Settings →
            Privacy & Security → Open Anyway**. (Right-click → Open no longer works on current macOS.)

            Grant **Microphone** access when macOS asks. For offline recognition, drop a whisper.cpp
            model (`ggml-*.bin`) into `~/.config/voiceghostty/models/` — see the README.

            Requires macOS 13+ (Apple Silicon). Built from source with `./make-app.sh`.
