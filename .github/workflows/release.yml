name: Build & Release

# Push a tag like v0.1.0 to build the .app and attach it to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  build:
    runs-on: macos-14      # Apple Silicon runner, ships with a Swift toolchain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Package .app bundle
        run: |
          set -euo pipefail
          APP=build/VoiceGhostty.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/VoiceGhostty "$APP/Contents/MacOS/"
          cp Resources/Info.plist        "$APP/Contents/"
          cp Resources/AppIcon.icns      "$APP/Contents/Resources/"
          # Ad-hoc signature (no paid Developer ID). Gatekeeper still quarantines
          # downloads — users run `xattr -cr` once, documented in the README.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "codesign OK"

      - name: Zip for release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          ZIP="VoiceGhostty-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/VoiceGhostty.app "$ZIP"
          echo "ASSET=$ZIP" >> "$GITHUB_ENV"
          shasum -a 256 "$ZIP"

      - name: Upload build artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceGhostty-app
          path: ${{ env.ASSET }}

      - name: Create / update GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          body: |
            ### Install
            1. Download the `.zip` below and unzip it.
            2. First launch is Gatekeeper-blocked (the app is ad-hoc signed, not notarized).
               Clear the quarantine flag once, then open:
               ```bash
               xattr -cr /Applications/VoiceGhostty.app   # or wherever you put it
               open VoiceGhostty.app
               ```
            3. Grant **Microphone** and **Speech Recognition** when macOS asks.

            Requires macOS 13+. Built from source with `swift build -c release`.
